interface:
  display_name: "VIM 5 App Launch"
  short_description: "VIM 5 launcher control, catalog, and app generation helper."
  default_prompt: "Use $khadas-vim-5-app-launch to query the VIM 5 app catalog, resolve canonical app IDs, start or stop apps through runtime/control-app, and send app generation requests with runtime/control-app generate --backend picoclaw when the user asks for a new app."
